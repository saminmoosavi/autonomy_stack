serial_number: j100-0000
version: 0
system:
  hosts:
    - hostname: cpr-j100-0000
      ip: 192.168.131.1
  ros2:
    namespace: j100_0000
platform:
  attachments:
    - name: front_fender
      type: j100.fender
    - name: rear_fender
      type: j100.fender
      rpy: [0.0, 0.0, 3.1415]
sensors:
  lidar3d:
  - model: velodyne_lidar
    urdf_enabled: true
    launch_enabled: true
    parent: default_mount
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
    ros_parameters:
      velodyne_driver_node:
        frame_id: lidar3d_0_laser
        device_ip: 192.168.131.25
        port: 2368
        model: VLP16
      velodyne_transform_node:
        model: VLP16
        fixed_frame: lidar3d_0_laser
        target_frame: lidar3d_0_laser
  camera:
    # Four RealSense cameras for ~360 deg coverage (front/left/right/rear) so
    # YOLO + the shield can detect people around the robot, not just ahead.
    # Each has the widened horizontal FOV set in intel_realsense.urdf.xacro.
    - model: intel_realsense          # FRONT
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.2, 0.0, 0.1]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "0"
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
    - model: intel_realsense          # LEFT
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.0, 0.2, 0.1]
      rpy: [0.0, 0.0, 1.5708]
      ros_parameters:
        intel_realsense:
          camera_name: camera_1
          device_type: d435
          serial_no: "1"
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
    - model: intel_realsense          # RIGHT
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.0, -0.2, 0.1]
      rpy: [0.0, 0.0, -1.5708]
      ros_parameters:
        intel_realsense:
          camera_name: camera_2
          device_type: d435
          serial_no: "2"
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
    - model: intel_realsense          # REAR
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [-0.2, 0.0, 0.1]
      rpy: [0.0, 0.0, 3.1416]
      ros_parameters:
        intel_realsense:
          camera_name: camera_3
          device_type: d435
          serial_no: "3"
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
